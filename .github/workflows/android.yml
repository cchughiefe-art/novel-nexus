name: Build Novel Nexus APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager is not available on this runner"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Novel Nexus branding
        shell: bash
        run: |
          if grep -RniE 'Novel[A]tlas|novel[a]tlas' \
            --exclude-dir=.git \
            --exclude='*.png' \
            --exclude='*.jpg' \
            --exclude='*.jpeg' .; then
            echo "Old NovelAtlas branding still exists."
            exit 1
          fi

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Novel-Nexus-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Novel-Nexus-debug-apk
          path: Novel-Nexus-debug.apk
          if-no-files-found: error
          retention-days: 14
