name: Build Novel Nexus APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK root: $SDK_ROOT"

          SDKMANAGER=""

          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/12.0/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ] && [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Novel Nexus branding
        shell: bash
        run: |
          if grep -RniE 'Novel[A]tlas|novel[a]tlas|com\.novel[a]tlas' \
            --exclude-dir=.git \
            --exclude-dir=.gradle \
            --exclude-dir=build .; then
            echo "Old branding remains."
            exit 1
          fi

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin --stacktrace

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Novel-Nexus-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Novel-Nexus-debug-apk
          path: Novel-Nexus-debug.apk
          if-no-files-found: error
          retention-days: 14
